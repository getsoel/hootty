name: "Default Pipeline"

stages:
  - name: Backlog
    type: manual
  - name: Research
    type: automated
    command: "Research the codebase relevant to this job. Read key files, understand the architecture, and summarize findings under ## Research in the job file."
  - name: Spec
    type: automated
    command: "Based on research, write a technical specification under ## Spec in the job file."
  - name: Review
    type: manual
  - name: Implement
    type: automated
  - name: Test
    type: automated
    command: "Write and run tests for the changes. Fix any failures."
  - name: Commit
    type: automated
    command: "/commit"
  - name: Done
    type: manual

settings:
  pause_on_error: true
  max_claims: null
  variables: {}
