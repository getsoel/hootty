included:
  - Sources/Hootty
  - Sources/HoottyCore
  - Tests/HoottyCoreTests

excluded:
  - Sources/CGhostty
  - ghostty
  - .build
  - Vendors


disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - line_length
  - nesting
  - no_fallthrough_only
  - todo
  - trailing_comma
  - type_body_length

identifier_name:
  min_length: 1
  allowed_symbols: ["_"]

type_name:
  min_length: 2

function_parameter_count:
  warning: 8

large_tuple:
  warning: 4
